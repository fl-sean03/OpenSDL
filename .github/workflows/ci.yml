name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the gate can be re-run against a commit without pushing another one. Without this,
  # a push that does not trigger a run leaves no way to establish whether main is green.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked pytest
      - run: uv run --locked --with-editable ./examples/digital-twin-surrogate/adapter pytest examples/digital-twin-surrogate/tests
      - run: uv run --locked opensdl twin validate examples/digital-twin-surrogate/twin.yaml
      - run: uv run --locked python scripts/check-boundaries.py
      - run: uv run --locked python scripts/generate-schemas.py --check

  # The campaign behind the README frame, re-derived. `plates.json` is what the picture is rendered
  # from, so it is a published claim about what this code does, and nothing re-ran it until now: a
  # change to the optimizer, the dye model, or the instrument noise would have left the frame
  # describing a campaign the code no longer runs, with every other check still green.
  #
  # Its own job rather than a step in `test`, because it costs a minute and would otherwise add
  # that minute to all three Python versions. Run in parallel it costs nothing on the wall clock.
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked pytest examples/discovering-colors/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked python scripts/check-propagation.py
      - run: uv run --locked python scripts/validate-repository.py
      - run: uv run --locked python scripts/check-version.py

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/digital-twin-surrogate/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/digital-twin-surrogate/viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- static
