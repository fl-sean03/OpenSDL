name: Conformance

on:
  pull_request:
    paths: ["adapters/**", "packages/capabilities/**", "tests/conformance/**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked pytest -m conformance
      - run: uv run --locked python examples/simulated-color-mixing/run_campaign.py
