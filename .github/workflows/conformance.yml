name: Conformance

on:
  pull_request:
    paths: ["adapters/**", "packages/capabilities/**", "tests/conformance/**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked pytest -m conformance
      - run: uv run --locked python examples/simulated-color-mixing/run_campaign.py
