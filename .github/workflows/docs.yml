name: Documentation

on:
  pull_request:
    paths: ["docs/**", "README.md", "mkdocs.yml", "packages/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group docs
      - run: uv run --locked mkdocs build --strict
