name: Build distribution candidates

# This workflow builds and does not publish. It produces every workspace wheel and sdist and
# uploads them as an Actions artifact that expires with the run. It creates no tag, no GitHub
# Release, no signature, no SBOM, and it uploads nothing to any package index. OpenSDL has never
# been published or tagged, and enabling either is a deliberate act with irreversible parts:
# docs/development/releasing.md states exactly what it would take and what it would cost.
#
# The gate below mirrors `make test lint example`, which is what `.agents/skills/release/run.sh`
# runs locally, so a candidate built here and one built by hand are validated the same way.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --group dev
      - run: make test lint example
      - run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
