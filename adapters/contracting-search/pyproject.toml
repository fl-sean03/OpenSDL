[project]
name = "opensdl-adapter-contracting-search"
version = "0.1.0a0"
description = "Deterministic contracting random search for reference campaigns."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core"
]

[project.entry-points."opensdl.optimizers"]
contracting-search = "opensdl_adapter_contracting_search.optimizer:ContractingSearch"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
