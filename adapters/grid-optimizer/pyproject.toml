[project]
name = "opensdl-adapter-grid-optimizer"
version = "0.1.0a0"
description = "Deterministic grid optimizer for reference campaigns."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core"
]

[project.entry-points."opensdl.optimizers"]
grid = "opensdl_adapter_grid_optimizer.optimizer:GridOptimizer"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
