[project]
name = "opensdl-adapter-human-task"
version = "0.1.0a0"
description = "Structured human-attestation capabilities for assisted laboratory workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-capabilities"
]

[project.entry-points."opensdl.adapters"]
human-task = "opensdl_adapter_human_task.adapter:HumanTaskAdapter"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
