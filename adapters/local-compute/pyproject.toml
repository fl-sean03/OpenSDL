[project]
name = "opensdl-adapter-local-compute"
version = "0.1.0a0"
description = "Safe in-process numerical analysis capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-capabilities"
]

[project.entry-points."opensdl.adapters"]
local-compute = "opensdl_adapter_local_compute.adapter:LocalComputeAdapter"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
