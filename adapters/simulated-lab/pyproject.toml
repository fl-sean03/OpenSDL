[project]
name = "opensdl-adapter-simulated-lab"
version = "0.1.0a0"
description = "Deterministic virtual balance, mixer, and colorimeter adapter."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-capabilities",
  "opensdl-simulation"
]

[project.entry-points."opensdl.adapters"]
simulated-lab = "opensdl_adapter_simulated_lab.adapter:SimulatedLabAdapter"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
