apiVersion: opensdl.dev/v0alpha1
kind: Laboratory
metadata:
  name: stalled-bench
  owner: OpenSDL
  description: The laboratory the recovery tasks are scored against, with a mixer that answers slowly
  tags: [benchmark, simulation]
spec:
  environment: simulation
  storage:
    database:
      url: sqlite:///./.opensdl/opensdl.db
    artifacts:
      root: .opensdl/artifacts
  runtime:
    max_concurrency: 4
    default_timeout_seconds: 30
    lease_ttl_seconds: 60
  adapters:
    - name: simulated-lab
      plugin: simulated-lab
      config:
        seed: 7
        color_noise: 0
        # Slow enough that a dispatched call is certainly still in flight when the setup abandons
        # it, and quick enough that an agent which correctly redoes the work is not made to wait
        # for it. This is what makes the interrupted state reachable honestly rather than written.
        latency_seconds: 2
    - name: local-compute
      plugin: local-compute
  capabilities:
    - capability: sim.mix_color
      adapter: simulated-lab
    - capability: sim.measure_color
      adapter: simulated-lab
    - capability: sim.measure_mass
      adapter: simulated-lab
    - capability: sim.locate_labware
      adapter: simulated-lab
    - capability: compute.euclidean_distance
      adapter: local-compute
  resources:
    - id: virtual-mixer
      name: Virtual mixer
      type: simulator
    - id: virtual-colorimeter
      name: Virtual colorimeter
      type: simulator
    - id: virtual-balance
      name: Virtual balance
      type: simulator
  policy:
    default_effect: deny
    version: benchmark/stalled/v1
    rules:
      - id: allow-simulation
        effect: allow
        capability: "*"
        environments: [simulation]
        operators: ["*"]
        risk_classes: [R0, R1]
        reason: Simulator-only benchmark profile
        priority: 10
