# Alembic configuration for authoring OpenSDL migrations from a checkout of this repository.
#
# The migration environment itself lives in the `opensdl-storage` distribution
# (`opensdl_storage:migrations`) so that it ships with the models it describes and a generated
# laboratory can migrate its store with `opensdl migrate` and no checkout at all. This file exists
# for `alembic revision --autogenerate` and for driving a migration by hand.
#
# `OPENSDL_DATABASE_URL` overrides `sqlalchemy.url` below.

[alembic]
script_location = opensdl_storage:migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./.opensdl/opensdl.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
