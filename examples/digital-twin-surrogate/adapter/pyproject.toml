[project]
name = "opensdl-adapter-cell-surrogate"
version = "0.1.0"
description = "Deterministic example-local cell surrogate for the OpenSDL digital-twin showcase."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core>=0.1.0a0",
  "opensdl-capabilities>=0.1.0a0",
]

[tool.uv.sources]
opensdl-core = { path = "../../../packages/core", editable = true }
opensdl-capabilities = { path = "../../../packages/capabilities", editable = true }

[project.entry-points."opensdl.adapters"]
cell-surrogate = "opensdl_adapter_cell_surrogate.adapter:CellSurrogateAdapter"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
