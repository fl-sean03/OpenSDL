id: cell.dispense
version: 0.1.0
name: Dispense formulation
description: Add declared per-well material volumes across one 96-well plate.
executor_type: instrument
input_schema:
  type: object
  required: [labware_id, additions]
  properties:
    labware_id:
      type: string
      minLength: 1
    additions:
      type: array
      minItems: 1
      maxItems: 16
      items:
        type: object
        required: [material_id, volume_per_well_ul]
        properties:
          material_id:
            type: string
            minLength: 1
          volume_per_well_ul:
            type: number
            exclusiveMinimum: 0
        additionalProperties: false
  additionalProperties: false
output_schema:
  type: object
  required:
    [labware_id, dispensed, well_count, volume_per_well_ul, aggregate_volume_ul]
  properties:
    labware_id:
      type: string
      minLength: 1
    dispensed:
      type: array
      minItems: 1
      maxItems: 16
      items:
        type: object
        required: [material_id, volume_per_well_ul]
        properties:
          material_id:
            type: string
            minLength: 1
          volume_per_well_ul:
            type: number
            exclusiveMinimum: 0
        additionalProperties: false
    well_count:
      type: integer
      const: 96
    volume_per_well_ul:
      type: number
      exclusiveMinimum: 0
    aggregate_volume_ul:
      type: number
      exclusiveMinimum: 0
  additionalProperties: false
risk_class: R1
required_resources: [cell-dispenser]
side_effects: [adds declared materials to labware contents]
timeout_seconds: 60
max_retries: 0
retry_safety: repeatable_if_not_dispatched
supports_cancellation: false
simulator_available: true
tags: [cell, liquid-handling, formulation]
