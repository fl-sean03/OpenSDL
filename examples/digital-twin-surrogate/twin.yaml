apiVersion: opensdl.dev/v0alpha1
kind: DigitalTwin
version: 0.1.0
revision: open-frame-self-driving-cell-2026-08-04
coordinateFrame:
  unit: m
  handedness: right
  upAxis: Z
  origin: [0.0, 0.0, 0.0]
scene:
  path: scene/assets/surrogate-cell.glb
  sha256: e658aef4f1df9c18c279b4f16270bd56281c57602eacf92f678c60a472e7bb4a
entities:
  - id: cell
    node: CellRoot
  - id: sample
    node: SampleCarrier
  - id: mover
    node: Mover
    resources: [cell-transport]
  - id: gripper-head
    node: GripperHead
    resources: [cell-transport]
  - id: pipette-head
    node: PipetteHead
    resources: [cell-dispenser]
  - id: mixer-rotor
    node: MixerRotor
    resources: [cell-mixer]
  - id: characterizer
    node: CharacterizerHousing
    resources: [cell-characterizer]
  - id: characterizer-door
    node: CharacterizerDoor
    resources: [cell-characterizer]
anchors:
  - id: input
    node: Anchor_Input
    position: [-1.56, -0.0535, 1.16865]
  - id: dispense
    node: Anchor_Dispense
    position: [-0.78, -0.0535, 1.14965]
  - id: mix
    node: Anchor_Mix
    position: [0.0, -0.0535, 1.22615]
  - id: characterize
    node: Anchor_Characterize
    position: [0.78, -0.0535, 1.17065]
  - id: output
    node: Anchor_Output
    position: [1.56, -0.0535, 1.16865]
animationTimeline:
  frameRate: 24
  frameStart: 1
  frameEnd: 1176
  # The gaps between phases are the cell's own housekeeping.  The two long
  # ones, 150-208 and 560-668, are head changes: the mover parks one head in
  # its dock and couples the other before the next commanded operation starts.
  # The second also carries the 48-frame hold the edit cuts on.  Frames after
  # 1040 are the park, the travel home and the closing hold, which are the
  # machine returning to rest rather than any commanded task.
  bindings:
    - id: input-to-dispense
      action: transfer
      parameterMatch: {source: input, destination: dispense}
      frameStart: 1
      frameEnd: 150
    - id: dispense-cycle
      action: play_clip
      parameterMatch: {clip: dispense_cycle}
      frameStart: 208
      frameEnd: 560
    - id: dispense-to-mix
      action: transfer
      parameterMatch: {source: dispense, destination: mix}
      frameStart: 668
      frameEnd: 728
    - id: mix-cycle
      action: play_clip
      parameterMatch: {clip: mix_cycle}
      frameStart: 728
      frameEnd: 804
    - id: mix-to-characterize
      action: transfer
      parameterMatch: {source: mix, destination: characterize}
      frameStart: 804
      frameEnd: 850
    - id: characterize-cycle
      action: play_clip
      parameterMatch: {clip: characterize_cycle}
      frameStart: 856
      frameEnd: 972
    - id: characterize-to-output
      action: transfer
      parameterMatch: {source: characterize, destination: output}
      frameStart: 978
      frameEnd: 1040
projectionRules:
  - id: transfer-started
    match:
      eventType: TaskStarted
      capability: cell.transfer_labware
      phase: started
    action: highlight
    target: mover
    parameters:
      active: true
      tone: cyan
  - id: transfer-confirmed
    match:
      eventType: TaskSucceeded
      capability: cell.transfer_labware
      phase: succeeded
    action: transfer
    target: sample
    parameterPointers:
      source: /event/payload/output/source
      destination: /event/payload/output/destination
      labware: /event/payload/output/labware_id
  - id: transfer-finished
    match:
      eventType: TaskSucceeded
      capability: cell.transfer_labware
      phase: succeeded
    action: highlight
    target: mover
    parameters:
      active: false
      tone: cyan
  - id: dispense-started
    match:
      eventType: TaskStarted
      capability: cell.dispense
      phase: started
    action: highlight
    target: pipette-head
    parameters:
      active: true
      tone: violet
  - id: dispense-motion
    match:
      eventType: TaskSucceeded
      capability: cell.dispense
      phase: succeeded
    action: play_clip
    target: pipette-head
    parameters:
      clip: dispense_cycle
  - id: dispense-confirmed
    match:
      eventType: TaskSucceeded
      capability: cell.dispense
      phase: succeeded
    action: set_property
    target: sample
    parameters:
      property: volume_per_well_ul
    parameterPointers:
      value: /event/payload/output/volume_per_well_ul
  - id: dispense-finished
    match:
      eventType: TaskSucceeded
      capability: cell.dispense
      phase: succeeded
    action: highlight
    target: pipette-head
    parameters:
      active: false
      tone: violet
  - id: mix-motion
    match:
      eventType: TaskSucceeded
      capability: cell.mix
      phase: succeeded
    action: play_clip
    target: mixer-rotor
    parameters:
      clip: mix_cycle
  - id: mix-confirmed
    match:
      eventType: TaskSucceeded
      capability: cell.mix
      phase: succeeded
    action: set_property
    target: sample
    parameters:
      property: mixed
      value: true
  - id: characterize-motion
    match:
      eventType: TaskSucceeded
      capability: cell.characterize
      phase: succeeded
    action: play_clip
    target: characterizer-door
    parameters:
      clip: characterize_cycle
  - id: response-confirmed
    match:
      eventType: TaskSucceeded
      capability: cell.characterize
      phase: succeeded
    action: set_property
    target: sample
    parameters:
      property: normalized_response
    parameterPointers:
      value: /event/payload/output/value
  - id: transfer-failed
    match:
      eventType: TaskFailed
      capability: cell.transfer_labware
      phase: failed
    action: highlight
    target: mover
    parameters: {active: true, tone: red, status: failed}
  - id: dispense-failed
    match:
      eventType: TaskFailed
      capability: cell.dispense
      phase: failed
    action: highlight
    target: pipette-head
    parameters: {active: true, tone: red, status: failed}
  - id: mix-failed
    match:
      eventType: TaskFailed
      capability: cell.mix
      phase: failed
    action: highlight
    target: mixer-rotor
    parameters: {active: true, tone: red, status: failed}
  - id: characterize-failed
    match:
      eventType: TaskFailed
      capability: cell.characterize
      phase: failed
    action: highlight
    target: characterizer-door
    parameters: {active: true, tone: red, status: failed}
  - id: transfer-cancelled
    match:
      eventType: TaskCancelled
      capability: cell.transfer_labware
      phase: cancelled
    action: highlight
    target: mover
    parameters: {active: true, tone: amber, status: cancelled}
  - id: dispense-cancelled
    match:
      eventType: TaskCancelled
      capability: cell.dispense
      phase: cancelled
    action: highlight
    target: pipette-head
    parameters: {active: true, tone: amber, status: cancelled}
  - id: mix-cancelled
    match:
      eventType: TaskCancelled
      capability: cell.mix
      phase: cancelled
    action: highlight
    target: mixer-rotor
    parameters: {active: true, tone: amber, status: cancelled}
  - id: characterize-cancelled
    match:
      eventType: TaskCancelled
      capability: cell.characterize
      phase: cancelled
    action: highlight
    target: characterizer-door
    parameters: {active: true, tone: amber, status: cancelled}
  - id: transfer-intervention
    match:
      eventType: TaskInterventionRequired
      capability: cell.transfer_labware
      phase: intervention_required
    action: highlight
    target: mover
    parameters: {active: true, tone: amber, status: intervention_required}
  - id: dispense-intervention
    match:
      eventType: TaskInterventionRequired
      capability: cell.dispense
      phase: intervention_required
    action: highlight
    target: pipette-head
    parameters: {active: true, tone: amber, status: intervention_required}
  - id: mix-intervention
    match:
      eventType: TaskInterventionRequired
      capability: cell.mix
      phase: intervention_required
    action: highlight
    target: mixer-rotor
    parameters: {active: true, tone: amber, status: intervention_required}
  - id: characterize-intervention
    match:
      eventType: TaskInterventionRequired
      capability: cell.characterize
      phase: intervention_required
    action: highlight
    target: characterizer-door
    parameters: {active: true, tone: amber, status: intervention_required}
  - id: transfer-recovery
    match:
      eventType: TaskRecoveryRequired
      capability: cell.transfer_labware
      phase: intervention_required
    action: highlight
    target: mover
    parameters: {active: true, tone: amber, status: recovery_required}
  - id: dispense-recovery
    match:
      eventType: TaskRecoveryRequired
      capability: cell.dispense
      phase: intervention_required
    action: highlight
    target: pipette-head
    parameters: {active: true, tone: amber, status: recovery_required}
  - id: mix-recovery
    match:
      eventType: TaskRecoveryRequired
      capability: cell.mix
      phase: intervention_required
    action: highlight
    target: mixer-rotor
    parameters: {active: true, tone: amber, status: recovery_required}
  - id: characterize-recovery
    match:
      eventType: TaskRecoveryRequired
      capability: cell.characterize
      phase: intervention_required
    action: highlight
    target: characterizer-door
    parameters: {active: true, tone: amber, status: recovery_required}
