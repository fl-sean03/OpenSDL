id: digital-twin-cell-cycle
name: Transfer, formulate, mix, and characterize
version: 0.1.0
description: Adapter-neutral laboratory-cell workflow used by the digital-twin surrogate showcase.
input_schema:
  type: object
  required: [labware_id, additions, mix_speed_rpm, mix_duration_seconds]
  properties:
    labware_id:
      type: string
      minLength: 1
    additions:
      type: array
      minItems: 1
      maxItems: 16
      items:
        type: object
        required: [material_id, volume_per_well_ul]
        properties:
          material_id:
            type: string
            minLength: 1
          volume_per_well_ul:
            type: number
            exclusiveMinimum: 0
        additionalProperties: false
    mix_speed_rpm:
      type: number
      exclusiveMinimum: 0
      maximum: 5000
    mix_duration_seconds:
      type: number
      exclusiveMinimum: 0
      maximum: 3600
  additionalProperties: false
steps:
  - id: input_to_dispense
    capability: cell.transfer_labware
    inputs:
      labware_id: ${inputs.labware_id}
      source: input
      destination: dispense
  - id: dispense
    capability: cell.dispense
    depends_on: [input_to_dispense]
    inputs:
      labware_id: ${steps.input_to_dispense.output.labware_id}
      additions: ${inputs.additions}
  - id: dispense_to_mix
    capability: cell.transfer_labware
    depends_on: [dispense]
    inputs:
      labware_id: ${steps.dispense.output.labware_id}
      source: dispense
      destination: mix
  - id: mix
    capability: cell.mix
    depends_on: [dispense_to_mix]
    inputs:
      labware_id: ${steps.dispense_to_mix.output.labware_id}
      speed_rpm: ${inputs.mix_speed_rpm}
      duration_seconds: ${inputs.mix_duration_seconds}
  - id: mix_to_characterize
    capability: cell.transfer_labware
    depends_on: [mix]
    inputs:
      labware_id: ${steps.mix.output.labware_id}
      source: mix
      destination: characterize
  - id: characterize
    capability: cell.characterize
    depends_on: [mix_to_characterize]
    inputs:
      labware_id: ${steps.mix_to_characterize.output.labware_id}
      method: normalized-response
  - id: characterize_to_output
    capability: cell.transfer_labware
    depends_on: [characterize]
    inputs:
      labware_id: ${steps.characterize.output.labware_id}
      source: characterize
      destination: output
outputs:
  labware_id: ${steps.characterize_to_output.output.labware_id}
  location: ${steps.characterize_to_output.output.destination}
  well_count: ${steps.dispense.output.well_count}
  volume_per_well_ul: ${steps.dispense.output.volume_per_well_ul}
  aggregate_volume_ul: ${steps.dispense.output.aggregate_volume_ul}
  mixture_id: ${steps.mix.output.mixture_id}
  characterization:
    method: ${steps.characterize.output.method}
    value: ${steps.characterize.output.value}
    unit: ${steps.characterize.output.unit}
    quality: ${steps.characterize.output.quality}
