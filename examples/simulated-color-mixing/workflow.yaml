id: color-mix-and-score
name: Mix, measure, and score color
version: 0.1.0
description: Demonstrates physical-state simulation followed by numerical analysis.
steps:
  - id: mix
    capability: sim.mix_color
    inputs:
      sample_id: ${inputs.sample_id}
      red_fraction: ${inputs.red_fraction}
      blue_fraction: ${inputs.blue_fraction}
      total_mass_g: ${inputs.total_mass_g}
  - id: color
    capability: sim.measure_color
    depends_on: [mix]
    inputs:
      sample_id: ${steps.mix.output.sample_id}
  - id: mass
    capability: sim.measure_mass
    depends_on: [mix]
    inputs:
      sample_id: ${steps.mix.output.sample_id}
  - id: score
    capability: compute.euclidean_distance
    depends_on: [color]
    inputs:
      a: ${steps.color.output.rgb}
      b: ${inputs.target_rgb}
outputs:
  sample_id: ${steps.mix.output.sample_id}
  measured_rgb: ${steps.color.output.rgb}
  measured_mass_g: ${steps.mass.output.mass}
  score: ${steps.score.output.distance}
