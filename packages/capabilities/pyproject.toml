[project]
name = "opensdl-capabilities"
version = "0.1.0a0"
description = "Capability adapters, registries, plugin discovery, and conformance."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "jsonschema>=4.23"
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
