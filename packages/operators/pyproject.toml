[project]
name = "opensdl-operators"
version = "0.1.0a0"
description = "Context packs and typed interfaces for human and software operators."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-capabilities",
  "opensdl-runtime",
  "opensdl-storage",
  "opensdl-schemas",
  "opensdl-provenance"
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
