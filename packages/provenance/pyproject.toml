[project]
name = "opensdl-provenance"
version = "0.1.0a0"
description = "Research provenance, portable run export, and repository propagation graphs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-storage",
  "PyYAML>=6"
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
