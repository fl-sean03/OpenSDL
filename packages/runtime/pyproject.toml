[project]
name = "opensdl-runtime"
version = "0.1.0a0"
description = "Reference workflow and campaign execution runtime."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-capabilities",
  "opensdl-policy",
  "opensdl-storage",
  "opensdl-workflows"
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
