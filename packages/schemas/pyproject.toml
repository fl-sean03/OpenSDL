[project]
name = "opensdl-schemas"
version = "0.1.0a0"
description = "Versioned manifests, schema generation, and validation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "PyYAML>=6",
  "jsonschema>=4.23"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
