[project]
name = "opensdl-sdk"
version = "0.1.0a0"
description = "Public Python SDK and HTTP client."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "opensdl-schemas",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
