[project]
name = "opensdl-storage"
version = "0.1.0a0"
description = "Relational metadata, event, lease, and content-addressed artifact storage."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.19.0,<2",
  "psycopg[binary]>=3.3.4,<4"
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The Alembic environment is data, not an importable subpackage: Alembic loads `env.py` and each
# revision by path. Without this, a built wheel carries the models and none of their migration
# history, and `opensdl migrate` in a generated laboratory has nothing to run.
[tool.setuptools.package-data]
opensdl_storage = ["migrations/env.py", "migrations/script.py.mako", "migrations/versions/*.py"]
