[project]
name = "opensdl-workflows"
version = "0.1.0a0"
description = "Workflow loading, validation, graph compilation, and value resolution."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "opensdl-core",
  "PyYAML>=6"
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
