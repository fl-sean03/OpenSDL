version: v0alpha1
nodes:
  - id: core-contracts
    description: Domain-neutral models and lifecycle
    paths: ["packages/core/**"]
  - id: generated-schemas
    description: Language-neutral public schemas
    paths: ["packages/schemas/**"]
  - id: twin
    description: Scene binding contract and deterministic event projection
    paths: ["packages/twin/**"]
  - id: storage-model
    description: Relational schema, repositories, and migrations
    paths: ["packages/storage/**", "database/**"]
  - id: capability-contracts
    description: Capability definitions, the registry, and the conformance harness
    paths: ["packages/capabilities/**"]
  - id: simulation
    description: Deterministic simulation, fault injection, and replay
    paths: ["packages/simulation/**"]
  - id: runtime
    description: Workflow and campaign execution
    paths: ["packages/runtime/**", "packages/workflows/**", "packages/policy/**"]
  - id: provenance
    description: Run exports, research graphs, and propagation
    paths: ["packages/provenance/**"]
  - id: adapters
    description: Physical, compute, human, and optimization integrations
    paths: ["adapters/**"]
  - id: domain-packs
    description: Namespaced scientific data models and schemas
    paths: ["domain-packs/**"]
  - id: operator-interfaces
    description: CLI, API, SDK, and context tools
    paths: ["packages/cli/**", "packages/sdk/**", "packages/operators/**", "apps/**"]
  - id: examples
    description: Runnable public laboratories
    paths: ["examples/**"]
  - id: conformance
    description: Cross-implementation compatibility tests
    paths: ["tests/conformance/**"]
  - id: cross-package-tests
    description: Integration, end-to-end, and repository-wide suites
    paths: ["tests/**"]
  - id: documentation
    description: Public guidance and architecture
    paths:
      - "README.md"
      - "SAFETY.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "docs/**"
  - id: agent-interface
    description: Repository instructions and the skills agents execute
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
  - id: repository-tooling
    description: Build, validation, and release automation shared by humans and CI
    paths:
      - "Makefile"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".gitignore"
      - "propagation.yaml"
  - id: project-governance
    description: Licensing, security reporting, and contribution policy
    paths:
      - "LICENSE"
      - "NOTICE"
      - "CITATION.cff"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
  - id: deployment
    description: Containers, CI, and development environments
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"
      - "deployments/**"
      - ".github/workflows/**"
edges:
  - source: core-contracts
    target: generated-schemas
    reason: public models generate schemas
  - source: core-contracts
    target: twin
    reason: scene bindings reference public identifiers
  - source: core-contracts
    target: storage-model
    reason: persistence maps public records
  - source: core-contracts
    target: capability-contracts
    reason: capability definitions extend public models
  - source: core-contracts
    target: simulation
    reason: simulated behavior uses lifecycle contracts
  - source: core-contracts
    target: runtime
    reason: execution uses lifecycle contracts
  - source: core-contracts
    target: adapters
    reason: adapters implement capability contracts
  - source: core-contracts
    target: domain-packs
    reason: domain packs extend public scientific models
  - source: generated-schemas
    target: operator-interfaces
    reason: interfaces expose public contracts
  - source: twin
    target: generated-schemas
    reason: the binding contract generates a public schema
  - source: twin
    target: operator-interfaces
    reason: interfaces expose twin definitions and projections
  - source: twin
    target: examples
    reason: the reference showcase exercises the binding contract
  - source: twin
    target: documentation
    reason: the scene binding contract requires public guidance
  - source: storage-model
    target: runtime
    reason: runtime depends on durable state
  - source: storage-model
    target: provenance
    reason: exports and graphs read durable state
  - source: storage-model
    target: cross-package-tests
    reason: migrations require integration evidence
  - source: capability-contracts
    target: simulation
    reason: simulated executors implement the capability interface
  - source: capability-contracts
    target: runtime
    reason: the runtime resolves and executes registered capabilities
  - source: capability-contracts
    target: adapters
    reason: adapters implement the capability adapter interface
  - source: capability-contracts
    target: operator-interfaces
    reason: the controller, API, and CLI read the capability registry
  - source: capability-contracts
    target: conformance
    reason: the conformance harness grades adapters against these contracts
  - source: simulation
    target: adapters
    reason: simulated adapters build on deterministic simulation
  - source: runtime
    target: operator-interfaces
    reason: interfaces invoke runtime behavior
  - source: runtime
    target: cross-package-tests
    reason: execution changes require end-to-end evidence
  - source: provenance
    target: operator-interfaces
    reason: interfaces expose exports, graphs, and propagation
  - source: adapters
    target: conformance
    reason: adapters require compatibility evidence
  - source: adapters
    target: examples
    reason: examples demonstrate integrations
  - source: domain-packs
    target: examples
    reason: examples validate scientific extensions
  - source: domain-packs
    target: documentation
    reason: domain contracts require public guidance
  - source: operator-interfaces
    target: examples
    reason: examples exercise public interfaces
  - source: operator-interfaces
    target: cross-package-tests
    reason: interface changes require integration evidence
  - source: examples
    target: documentation
    reason: docs show tested workflows
  - source: conformance
    target: deployment
    reason: CI and releases enforce conformance
  - source: cross-package-tests
    target: deployment
    reason: CI runs the cross-package suites
  - source: operator-interfaces
    target: documentation
    reason: command and API references must stay current
  - source: operator-interfaces
    target: agent-interface
    reason: skills invoke the CLI, API, and SDK surfaces
  - source: agent-interface
    target: documentation
    reason: public guidance describes the agent workflow
  - source: repository-tooling
    target: agent-interface
    reason: skills run the repository's commands
  - source: repository-tooling
    target: deployment
    reason: CI runs the same targets and scripts
  - source: repository-tooling
    target: documentation
    reason: the development guide states the commands
  - source: project-governance
    target: documentation
    reason: published policy must match the stated commitments
